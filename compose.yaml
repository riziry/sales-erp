services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yw_quotation
      POSTGRES_USER: yw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yw_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yw_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yw -d yw_quotation"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  yw_database:
